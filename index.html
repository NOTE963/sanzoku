const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=640;let scale=1,ox=0,oy=0,dpr=1;
const nameEl=document.createElement('input');
nameEl.type='text';nameEl.maxLength=8;nameEl.placeholder='なまえ（ランキング用）';
nameEl.style.cssText='position:fixed;z-index:5;display:none;box-sizing:border-box;border:2px solid #222;background:#fff;color:#222;text-align:center;outline:none;padding:0;margin:0;border-radius:0;-webkit-user-select:text;user-select:text;touch-action:auto;font-family:sans-serif';
document.body.appendChild(nameEl);
nameEl.addEventListener('input',()=>{save.name=nameEl.value.trim().slice(0,8);persist()});
nameEl.addEventListener('change',()=>{save.name=nameEl.value.trim().slice(0,8);persist();if(save.name&&save.best>0)submitScore()});
nameEl.addEventListener('keydown',e=>{if(e.key==='Enter')nameEl.blur()});
function placeName(){
  const show=state==='home';nameEl.style.display=show?'block':'none';if(!show)return;
  if(document.activeElement!==nameEl&&nameEl.value!==save.name)nameEl.value=save.name;
  const k=scale/dpr;
  nameEl.style.left=(ox/dpr+(W/2-80)*k)+'px';nameEl.style.top=(oy/dpr+288*k)+'px';
  nameEl.style.width=(160*k)+'px';nameEl.style.height=(24*k)+'px';nameEl.style.fontSize=(13*k)+'px';
}
function resize(){dpr=window.devicePixelRatio||1;const w=innerWidth,h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;scale=Math.min(w/W,h/H)*dpr;ox=(cv.width-W*scale)/2;oy=(cv.height-H*scale)/2;}
addEventListener('resize',resize);resize();

const imgs=IMGS.map(s=>{const i=new Image();i.src=s;return i});
const sils=[];
function getSil(i){
 if(sils[i])return sils[i];
 const im=imgs[i];if(!im.complete||!im.naturalWidth)return null;
 const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
 const x=c.getContext('2d');x.drawImage(im,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#8a8a8a';x.fillRect(0,0,c.width,c.height);
 sils[i]=c;return c;
}
// 色違い（ブロンズ/シルバー/ダイヤ/ルビー/エメラルド）：明るさを保ったまま金属色に塗り替える
const tints={};
function getTint(i,c){
  if(!c)return imgs[i];
  const k=i+'_'+c;if(tints[k])return tints[k];
  const im=imgs[i];if(!im.complete||!im.naturalWidth)return null;
  const cn=document.createElement('canvas');cn.width=im.naturalWidth;cn.height=im.naturalHeight;
  const x=cn.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,cn.width,cn.height),a=d.data,V=COLS[c];
  for(let p=0;p<a.length;p+=4){
   if(!a[p+3])continue;
   const L=Math.pow((a[p]*.299+a[p+1]*.587+a[p+2]*.114)/255,.9);
   for(let q=0;q<3;q++){const m=V.dk[q]+(V.lt[q]-V.dk[q])*L;a[p+q]=a[p+q]*(1-V.m)+m*V.m}
  }

function bnote(f,d,type,v,t0){
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+d);

 const n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),data=buf.getChannelData(0);

async function loadRank(){
 rank.loading=true;rank.err=false;rank.list=null;
 try{
  await fb.promise;if(!fb.ready)throw new Error('fb');
  const q=await fb.db.collection('ranking').orderBy('score','desc').limit(10).get();
  rank.list=q.docs.map(d=>{const v=d.data();return {uid:d.id,name:v.name||'名無し',score:+v.score||0}});
 }catch(e){rank.err=true}
 rank.loading=false;
}
async function submitScore(){
 if(!save.name){
  let n=null;try{n=prompt('ランキング用の名前を入力してください（8文字まで）','')}catch(e){}
  save.name=(n||'名無し').trim().slice(0,8)||'名無し';persist();
 }
 try{
  await fb.promise;if(!fb.ready)return;
  await fb.db.collection('ranking').doc(save.uid).set({name:save.name,score:save.best,ts:Date.now()});
 }catch(e){}
}

// ===== 更新 =====
function spawnWave(){
 // 時間とともに速く・多くなる（1回に最大2体。必ず2レーンは空く）
 const n=Math.min(LANES-2,1+Math.floor(t/10+Math.random()*.99));
 const lanes=Array.from({length:LANES},(_,i)=>i).sort(()=>Math.random()-.5).slice(0,n);
 const sp=Math.min(950,280+t*9);
 for(const l of lanes)enemies.push({lane:l,x:laneX(l),y:-60-Math.random()*40,w:60,h:60,vy:sp*(.9+Math.random()*.2)});
}
function update(dt){
 if(state==='gacha'){updateGacha(dt);return}
 if(state==='home'||state==='rank'||state==='coll'||state==='dex')return;
 if(shake>0)shake-=dt;
 if(fx.slash>0)fx.slash-=dt;
 if(fx.voice>0)fx.voice-=dt;
  if(fx.cut>0)fx.cut-=dt;
 for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=900*dt;q.l-=dt}
 particles=particles.filter(q=>q.l>0);
 for(const n of notes){n.y-=60*dt;n.l-=dt}
 for(const w of walls){w.age+=dt;if(w.flash>0)w.flash-=dt}
 notes=notes.filter(n=>n.l>0);
 if(state!=='play')return;
 t+=dt;
 const was=sk.cd;
 sk.cd=Math.max(0,sk.cd-dt);sk.barrier=Math.max(0,sk.barrier-dt);sk.slow=Math.max(0,sk.slow-dt);
 if(was>0&&sk.cd===0&&CH[save.equip].skill)sfx('ready');
 if(sk.slow>0&&Math.random()<dt*8)notes.push({x:Math.random()*W,y:BAR-10,l:1.4});
 p.x+=(laneX(p.lane)-p.x)*Math.min(1,dt*18);p.run+=dt;
 spawnT-=dt;
 if(spawnT<=0){spawnWave();spawnT=Math.max(.3,.95-t*.012)+Math.random()*.15}
 const mult=sk.slow>0?.35:1;
 for(const e of enemies){
  if(e.safe){if(e.bt>0){e.bt-=dt;e.y+=e.vy*mult*dt*.6}else e.y-=e.vy*mult*dt*.9}else e.y+=e.vy*mult*dt;
  if(e.dead||e.safe)continue;
  for(const w of walls){
   if(w.hp>0&&e.lane===w.lane&&e.y+e.h*.9>WT&&e.y+e.h*.1<WB){
    e.dead=true;w.hp--;w.flash=.25;boom(e.x,e.y+e.h/2,'#2a8a5a',10);
    if(w.hp<=0){sfx('wallBreak');boom(w.x,(WT+WB)/2,'#8a5a1a',22)}else sfx('barrierHit');
    break;
   }
  }
  if(e.dead)continue;
  if(Math.abs(e.x-p.x)<38&&e.y+e.h*.9>PY-PH+10&&e.y+e.h*.1<PY){
   if(sk.barrier>0){e.dead=true;boom(e.x,e.y+e.h/2,'#4aa3ff',10);sfx('barrierHit')}
   else{state='over';overAt=performance.now();shake=.4;boom(p.x,PY-35,'#e84a4a',28);sfx('over');endGame();break}
  }
  if(!e.passed&&e.y>PY+8){e.passed=true;dodged++}
 }
 enemies=enemies.filter(e=>!e.dead&&e.y<H+100&&e.y>-220);walls=walls.filter(w=>w.hp>0);
}
function endGame(){
 gained=score();save.coins+=gained;
 if(gained>save.best){save.best=gained;newBest=true;sfx('best');submitScore()}
 persist();
}

function rays(cx,cy,n,rot,alpha,rgb,L,w){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
 const g=ctx.createLinearGradient(0,0,0,-L);g.addColorStop(0,'rgba('+rgb+','+Math.min(1,alpha)+')');g.addColorStop(1,'rgba('+rgb+',0)');
 ctx.fillStyle=g;
 for(let i=0;i<n;i++){ctx.rotate(Math.PI*2/n);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-w,-L);ctx.lineTo(w,-L);ctx.closePath();ctx.fill()}
 ctx.restore();
}
function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}

const BKW=160,BKH=230,BKT=215;
function bkCover(){
  ctx.fillStyle='#5a2615';ctx.fillRect(0,0,BKW,BKH);
  ctx.fillStyle='#7a3820';ctx.fillRect(6,6,BKW-12,BKH-12);
  ctx.strokeStyle='#e8c25a';ctx.lineWidth=3;ctx.strokeRect(18,14,BKW-30,BKH-28);
  ctx.lineWidth=1.5;ctx.strokeRect(24,20,BKW-42,BKH-40);
  ctx.fillStyle='#3f180c';ctx.fillRect(0,0,12,BKH);
  ctx.fillStyle='#e8c25a';for(let i=0;i<4;i++)ctx.fillRect(0,28+i*55,12,4);
  txt('★',BKW/2+6,82,28,'#f3d27a');
  txt('歴史',BKW/2+6,138,42,'#f3d27a');
  txt('— 英雄の書 —',BKW/2+6,170,12,'#f3d27a');
}
function bkPaper(lines){
  ctx.fillStyle='#f4e6c0';ctx.fillRect(0,0,BKW,BKH);
  if(lines){ctx.fillStyle='rgba(120,80,30,.35)';for(let i=0;i<11;i++){const lw=60+((i*37)%70);ctx.fillRect(14,28+i*17,Math.min(lw,BKW-28),3)}}
  ctx.strokeStyle='#c9ac6a';ctx.lineWidth=2;ctx.strokeRect(5,5,BKW-10,BKH-10);
}
// sx: 1=右側に閉じている ～ -1=左側に開ききった
function bkFlap(spine,sx,kind,lines){
  ctx.save();ctx.translate(spine,BKT);
  if(sx>=0)ctx.scale(Math.max(.001,sx),1);else{ctx.scale(Math.max(.001,-sx),1);ctx.translate(-BKW,0)}
  if(kind==='cover'&&sx>=0)bkCover();else bkPaper(lines);
  ctx.fillStyle='rgba(0,0,0,'+(.3*(1-Math.abs(sx)))+')';ctx.fillRect(0,0,BKW,BKH);
  ctx.restore();
}
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}

function drawGachaStage(){
  if(gacha.phase===4){drawGachaList();return}
  const g=gacha,tt=g.t,id=g.result.id,c=CH[id],col=g.result.col,V=COLS[col];
  const bgc=ctx.createRadialGradient(180,330,20,180,330,440);
  bgc.addColorStop(0,g.phase===3?V.bg:'#33200f');bgc.addColorStop(1,'#050302');
  ctx.fillStyle=bgc;ctx.fillRect(0,0,W,H);
  const p=g.phase===1?0:g.phase===2?smooth(tt/1.0):1;
  const spine=100+80*p;
  const coverSx=g.phase===1?1:g.phase===3?-1:Math.cos(Math.PI*p);
  if(g.phase===3){
   rays(180,330,16,tt*.6,.7,V.rgb,620,26);
   for(let i=0;i<3;i++){const r=(tt-i*.18)*560;if(r>0&&r<520){ctx.strokeStyle='rgba('+V.rgb+','+(1-r/520)+')';ctx.lineWidth=10;ctx.beginPath();ctx.arc(180,330,r,0,7);ctx.stroke()}}
  }
  ctx.save();
  if(g.phase===1){ctx.translate(0,Math.sin(performance.now()/300)*5);
   const gl=ctx.createRadialGradient(180,330,40,180,330,230);gl.addColorStop(0,'rgba(255,210,90,.35)');gl.addColorStop(1,'rgba(255,210,90,0)');ctx.fillStyle=gl;ctx.fillRect(0,100,W,460)}
  // 影
  const lx=coverSx<0?spine-BKW*(-coverSx):spine;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(lx+6,BKT+9,spine+BKW-lx,BKH);
  // 右ページ
  ctx.save();ctx.translate(spine,BKT);bkPaper(g.phase<3);ctx.restore();
  bkFlap(spine,coverSx,'cover',false);
  if(g.phase>=2)for(let k=0;k<2;k++){
   const st=1.0+k*.35,sx=g.phase===3||tt>=st+.35?-1:tt>=st?Math.cos(Math.PI*(tt-st)/.35):null;
   if(sx!==null)bkFlap(spine,sx,'page',true);
  }
  // 開くときの光もれ
  if(g.phase>=2){
   const ga=g.phase===3?.35:Math.max(0,Math.min(1,(tt-.3)/1.2))*.6;
   ctx.globalCompositeOperation='lighter';
   const gl=ctx.createRadialGradient(spine,BKT+BKH/2,10,spine,BKT+BKH/2,190);
   gl.addColorStop(0,'rgba('+V.rgb+','+ga+')');gl.addColorStop(1,'rgba('+V.rgb+',0)');
   ctx.fillStyle=gl;ctx.fillRect(0,120,W,420);ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();
  if(g.phase===1){
   strokeTxt('歴史の本',W/2,160,34,'#f3d27a','#222');
   if(Math.floor(performance.now()/500)%2)txt('タップして開く',W/2,500,20,'#ffd34d');
  }
  if(g.phase===3){
   for(const cf of g.conf){ctx.save();ctx.translate(cf.x,cf.y);ctx.rotate(cf.rot);ctx.fillStyle=cf.c;ctx.fillRect(-cf.w/2,-cf.h/2,cf.w,cf.h);ctx.restore()}
   // 右ページ：キャラ
   const s=easeOutBack(Math.min(1,tt/.6));
   ctx.save();ctx.translate(spine+BKW/2,BKT+BKH-34);ctx.scale(Math.max(.01,s),Math.max(.01,s));
   ctx.shadowColor=V.gl;ctx.shadowBlur=26;drawImg(id,0,0,140,170,false,col);ctx.restore();
   if(col>=3){const now=performance.now();for(let i=0;i<6;i++){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(now/260+i));txt('✦',spine+BKW/2+Math.cos(now/900+i*1.1)*58,BKT+110+Math.sin(now/700+i*2)*60,16,V.gl)}ctx.globalAlpha=1}
   strokeTxt(c.r,spine+12,BKT+36,26,'#ffd34d','#5a3a00','left');
   txt(V.n,spine+BKW/2,BKT+BKH-12,14,V.c);
   // 左ページ：説明
   ctx.globalAlpha=Math.min(1,Math.max(0,(tt-.3)/.5));
   const cx=spine-BKW/2,ink='#3a2410';
   txt(c.n,cx,BKT+52,22,ink);
   txt(col?'（'+V.n+'）':'（ノーマル）',cx,BKT+78,15,V.c);
   ctx.fillStyle='#c9ac6a';ctx.fillRect(cx-55,BKT+92,110,2);
   txt(c.skill?'能力：'+c.sname:'能力なし',cx,BKT+118,14,c.col||ink);
   txt(c.skill?c.info:'最初から使えるキャラ',cx,BKT+140,12,'#5a3a1a',null,false);
   if(g.result.dup)txt('ダブり +'+g.result.refund,cx,BKT+BKH-26,17,'#a36a00');
   else{const k=1+Math.sin(performance.now()/120)*.08;ctx.save();ctx.translate(cx,BKT+BKH-24);ctx.scale(k,k);strokeTxt('NEW!',0,0,30,'#ff5a4a','#fff');ctx.restore()}
   ctx.globalAlpha=1;
   if(tt<.3){ctx.fillStyle='rgba(255,255,255,'+(1-tt/.3)+')';ctx.fillRect(0,0,W,H)}
   if(g.seq)txt((g.i+1)+' / '+g.seq.length,W/2,180,18,'#fff');
   if(tt>(g.seq?.7:1.2)&&Math.floor(performance.now()/500)%2)txt(g.seq?(g.i<g.seq.length-1?'タップで次へ':'タップで結果へ'):'タップで閉じる',W/2,500,16,'#fff');
  }
  if(g.seq&&g.phase<4){box(258,6,94,36,'rgba(0,0,0,.55)','#fff',2);txt('スキップ',305,30,16,'#fff');txt((g.i+1)+'/'+g.seq.length,14,30,15,'#fff','left')}
}
function drawGame(){
 if(shake>0)ctx.translate((Math.random()-.5)*14*shake*2.5,(Math.random()-.5)*14*shake*2.5);
 for(let l=0;l<LANES;l++)box(l*LW,0,LW+1,BAR,l%2?'#f3f3f3':'#fff');
 ctx.fillStyle='#c8c8c8';const off=(t*300)%60;
 for(let l=1;l<LANES;l++)for(let y=-60;y<BAR;y+=60)ctx.fillRect(l*LW-1.5,y+off,3,30);
 // 山賊（敵）：赤い光で自分と区別
 ctx.save();ctx.shadowColor='rgba(220,40,30,.95)';ctx.shadowBlur=8;
 for(const e of enemies)if(!e.safe)drawImg(0,e.x,e.y+e.h,e.w,e.h);
 ctx.restore();
 for(const e of enemies)if(e.safe){ctx.globalAlpha=.6;drawImg(0,e.x,e.y+e.h,e.w,e.h);ctx.globalAlpha=1;txt('帰',e.x,e.y-2,18,'#b8860b')}
 if(fx.voice>0){const v=1-fx.voice/.9;ctx.save();ctx.lineWidth=5;for(let i=0;i<3;i++){const r=v*420-i*60;if(r>0){ctx.strokeStyle='rgba(224,160,0,'+Math.max(0,1-r/420)+')';ctx.beginPath();ctx.arc(p.x,PY-40,r,0,7);ctx.stroke()}}ctx.restore()}
 for(const w of walls){
  const k=Math.min(1,w.age/.2),sc=k<1?easeOutBack(k):1,cx=w.x,cy=(WT+WB)/2,ww=LW-12,hh=WB-WT;
  ctx.save();ctx.translate(cx,cy);ctx.scale(Math.max(.01,sc),Math.max(.01,sc));
  ctx.fillStyle='#222';ctx.fillRect(-ww/2+4,-hh/2+4,ww,hh);
  box(-ww/2,-hh/2,ww,hh,'#f4e6c0','#222',3);
  txt(w.ch,0,6,44,'#3a2410');
  for(let i=0;i<w.max;i++){ctx.fillStyle=i<w.hp?'#2a8a5a':'#cfcfcf';ctx.fillRect(-w.max*7+i*14+1,hh/2-14,12,8)}
  if(w.flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(1,w.flash/.25)*.8+')';ctx.fillRect(-ww/2,-hh/2,ww,hh)}
  ctx.restore();
 }
 if(state==='play'){
  ctx.fillStyle='rgba(47,111,214,.3)';ctx.strokeStyle='#2f6fd6';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(p.x,PY,30,8,0,0,7);ctx.fill();ctx.stroke();
  if(save.eqcol>=2){ctx.save();ctx.shadowColor=COLS[save.eqcol].gl;ctx.shadowBlur=14}
   drawImg(save.equip,p.x,PY-Math.abs(Math.sin(p.run*14))*3,62,88,false,save.eqcol);
   if(save.eqcol>=2)ctx.restore();
  if(sk.barrier>0&&(sk.barrier>1||Math.floor(sk.barrier*10)%2)){
   ctx.fillStyle='rgba(80,170,255,.22)';ctx.strokeStyle='rgba(40,120,230,.9)';ctx.lineWidth=4;
   ctx.beginPath();ctx.arc(p.x,PY-42,50,0,7);ctx.fill();ctx.stroke();
  }
 }
 if(fx.slash>0){
  ctx.save();ctx.globalAlpha=Math.min(1,fx.slash/.3);ctx.strokeStyle='#d9382a';ctx.lineWidth=10;ctx.lineCap='round';
  const x0=Math.max(0,(p.lane-1)*LW),x1=Math.min(W,(p.lane+2)*LW);
  ctx.beginPath();ctx.moveTo(x0,PY-360);ctx.lineTo(x1,PY-60);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x1,PY-360);ctx.lineTo(x0,PY-60);ctx.stroke();ctx.restore();
 }
 if(sk.slow>0)box(0,0,W,BAR,'rgba(138,63,208,.08)');
 for(const n of notes){ctx.globalAlpha=Math.max(0,Math.min(1,n.l));txt('♪',n.x,n.y,26,'#8a3fd0')}
 ctx.globalAlpha=1;
 for(const q of particles){ctx.globalAlpha=Math.max(0,q.l*1.4);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,6,6)}
 ctx.globalAlpha=1;
 drawCut();
  strokeTxt('SCORE '+score(),12,44,30,'#222','#fff','left');
 txt('BEST '+save.best+'　よけた '+dodged,12,68,15,'#555','left');
 const eff=sk.barrier>0?'バリア '+sk.barrier.toFixed(1)+'s':sk.slow>0?'スロー '+sk.slow.toFixed(1)+'s':'';
 if(eff)txt(eff,W-12,44,18,'#8a3fd0','right');
 drawBar();
 if(state==='over'){
  box(0,0,W,H,'rgba(255,255,255,.75)');
  box(30,120,300,400,'#fff','#222',4);
  strokeTxt('やられた！',W/2,185,44,'#d9382a','#222');
  txt('SCORE '+gained,W/2,250,34);
  txt('生存 '+Math.floor(t)+' ＋ よけた '+dodged,W/2,282,16,'#555',null,false);
  txt(newBest?'ベスト更新！':'BEST '+save.best,W/2,315,20,'#e08a00');
  txt('コイン +'+gained+'（合計 '+save.coins+'）',W/2,345,16);
  button(60,385,240,56,'もう一度','#e8573d',()=>startGame(),null,true);
  button(60,455,240,50,'ホーム','#777',()=>state='home');
 }
}
function drawCut(){
  if(!(fx.cut>0))return;
  const D=.9,k=Math.min(1,1-fx.cut/D),a=k<.12?k/.12:k>.78?(1-k)/.22:1,e=k<.3?1-Math.pow(1-k/.3,3):1;
  ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,a));
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,BAR);
  const bx=(1-e)*-W*.6;
  ctx.fillStyle=fx.cc;ctx.beginPath();ctx.moveTo(bx,210);ctx.lineTo(bx+W,150);ctx.lineTo(bx+W,440);ctx.lineTo(bx,500);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=3;
  for(let i=0;i<10;i++){const y=175+i*29,o=(k*1100+i*151)%520;ctx.beginPath();ctx.moveTo(W-o,y);ctx.lineTo(W-o+100,y);ctx.stroke()}
  const cx=-140+(W/2+140)*e;
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=18;
  drawImg(fx.ci,cx,430,200,270,false,fx.cco);
  ctx.shadowBlur=0;
  strokeTxt(fx.cn,W/2+(1-e)*W,478,34,'#fff','#222');
  ctx.restore();
}
function drawBar(){
 box(0,BAR,W,H-BAR,'#f2f2f2');
 ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,BAR);ctx.lineTo(W,BAR);ctx.stroke();
 const c=CH[save.equip];
 if(!c.skill){txt('能力なし（ガチャでキャラを集めよう）',W/2,BAR+42,14,'#777');return}
 const x=50,y=BAR+10,w=260,h=50,ready=sk.cd<=0,cmax=sk.cdMax||skCd(c,save.eqcol);
 if(state==='play')buttons.push({x,y,w,h,fn:useSkill,q:true});
 const active=sk.barrier>0||sk.slow>0;
 box(x,y,w,h,ready?c.col:'#cfcfcf','#222',3);
 if(!ready){ctx.fillStyle=c.col;ctx.globalAlpha=.55;ctx.fillRect(x,y,w*(1-sk.cd/cmax),h);ctx.globalAlpha=1;box(x,y,w,h,'rgba(0,0,0,0)','#222',3)}
 txt(ready?c.sname+'　発動！':c.sname+'（'+Math.ceil(sk.cd)+'秒）',x+w/2,y+h/2+8,22,ready||active?'#fff':'#222');
}

fb.promise=fbInit();
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
